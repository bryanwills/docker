services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0          # listen inside the container only
      - OLLAMA_NUM_PARALLEL=2        # max concurrent requests (tune down if CPU pegs)
      - OLLAMA_MAX_LOADED_MODELS=1   # keep only 1 model loaded (save RAM on CPU-only)
      - OLLAMA_KEEP_ALIVE=10m        # unload model after 10m of inactivity to free RAM
      # Refuse cross-origin browser abuse if something ever proxies this later
      - OLLAMA_ORIGINS=http://127.0.0.1:*,http://localhost:*
    volumes:
      - ollama-models:/root/.ollama  # persist downloaded models across restarts
    # Localhost-only — NOT published on 0.0.0.0, NOT on Traefik.
    # Hermes / host tools use http://127.0.0.1:11435/v1
    # Tailscale peers can reach via MagicDNS + this bind if you later add a
    # Tailscale serve / funnel rule intentionally; nothing is on the public net.
    ports:
      - "127.0.0.1:11435:11434"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Stay off the public Traefik proxy network — no ollama.bryanwills.dev route
    networks:
      - ollama_internal
    # Intentionally NO traefik.* labels — keeps models off the public internet
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  ollama-models:
    driver: local

networks:
  ollama_internal:
    driver: bridge
