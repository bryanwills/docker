---
# Dashy configuration
# Docs: https://dashy.to/docs/configuring
#
# Groupings mirror config/services.yaml in the Homepage dashboard
# (/home/bryanwi09/docker/Homepage/config/services.yaml) so both
# dashboards present the same sections in the same order.

pageInfo:
  title: Homelab Dashboard
  description: Bryan's self-hosted services
  navLinks:
    - title: Homepage
      path: https://homepage.bryanwills.dev
    - title: GitHub
      path: https://github.com/bryanwills

appConfig:
  theme: colorful
  layout: auto
  iconSize: medium
  language: en
  statusCheck: true
  statusCheckInterval: 0

sections:
