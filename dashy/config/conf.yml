    icon: fas fa-shield-alt
    items:
      - title: Dashy
        description: This dashboard
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dashy.png
        url: https://dashy.bryanwills.dev
        target: newtab
        statusCheck: true
      - title: Traefik
        description: Reverse proxy / router dashboard
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/traefik.png
